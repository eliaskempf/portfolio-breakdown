site_name: Portfolio Breakdown
site_description: Local portfolio analysis — user guide
site_url: https://eliaskempf.github.io/portfolio-breakdown/dev/
docs_dir: docs/user
site_dir: dist/docs-site
use_directory_urls: true
strict: true
theme:
  name: material
  font: false
  palette:
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - search.highlight
plugins:
  - search
markdown_extensions:
  - attr_list
  - admonition
hooks:
  - tools/docs_site.py
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
  - Start here: index.md
  - Setup:
      - Install and run: install.md
      - Your first portfolio: getting-started.md
  - Holdings:
      - Positions and buy-ins: positions.md
      - Import holdings: import.md
  - Analysis:
      - Exposure and ETFs: exposure.md
      - Prices and performance: performance.md
      - Analytics and risk: analytics.md
  - Planning:
      - Categories and targets: allocation.md
      - Rebalance: rebalance.md
  - Help:
      - Storage and recovery: storage.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Data formats: reference.md
      - Source development: development.md
