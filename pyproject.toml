[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-breakdown"
version = "0.1.0"
description = "Local portfolio valuation and hierarchical allocation analysis"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "python-calamine>=0.3,<1",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "streamlit>=1.63,<2",
  "yfinance>=0.2.65,<2",
  "platformdirs>=4,<5",
]

[project.scripts]
portfolio-app = "portfolio_app.app:main"
portfolio-check-private = "portfolio_app.privacy:main"

[dependency-groups]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]
release = ["pyinstaller>=6.19,<7", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_app"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/AGENTS.md", "/LICENSE", "/docs", "/tools", "/packaging", "/.github", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/.githooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
