[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-breakdown"
version = "0.1.0"
description = "Local portfolio valuation and hierarchical allocation analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "python-calamine>=0.3,<1",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "streamlit>=1.63,<2",
  "yfinance>=0.2.65,<2",
]

[project.scripts]
portfolio-app = "portfolio_app.app:main"
portfolio-check-private = "portfolio_app.privacy:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_app"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/.githooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
