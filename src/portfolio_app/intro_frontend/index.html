<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakdown · Intro animation</title>
<style>
  :root { --intro-background: #11151C; color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--intro-background); color: #e7eaf0; }
  main { width: min(960px, calc(100% - 48px)); margin: 64px auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 20px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .17em; text-transform: uppercase; color: #8e99ae; margin: 0 0 8px; }
  h1 { font-size: 24px; font-weight: 520; letter-spacing: -.03em; margin: 0; }
  .palette { display: flex; gap: 7px; }
  .palette i { width: 9px; height: 9px; border-radius: 50%; display: block; background: #5470C6; }
  .palette i:nth-child(2) { background: #4AA9B3; }
  .palette i:nth-child(3) { background: #9A6DD7; }
  .stage { background: var(--intro-background); border: 1px solid #222936; border-radius: 20px; overflow: hidden; }
  #scene { display: block; width: 100%; height: auto; overflow: visible; }
  #letters text { font-family: inherit; font-size: 106px; font-weight: 650; text-anchor: middle; }
  .controls { margin: 24px 0 0; display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; }
  button { font: inherit; font-size: 12px; font-weight: 550; background: #171e29; border: 1px solid #303b4d; color: #e7eaf0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:hover { background: #232e3e; }
  button:focus-visible, input:focus-visible { outline: 2px solid #93a8e6; outline-offset: 4px; }
  input[type=range] { accent-color: #748ddd; width: 100%; cursor: pointer; }
  #clock { min-width: 77px; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; color: #94a0b6; }
  footer { margin-top: 24px; display: flex; justify-content: space-between; gap: 16px; color: #8e99ae; font-size: 12px; line-height: 1.6; }
  #phase { color: #bbc5d6; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  body.embedded { background: var(--intro-background); }
  .embedded main { width: 100%; margin: 0; }
  .embedded header, .embedded .controls, .embedded footer { display: none; }
  .embedded .stage { border: 0; border-radius: 0; background: var(--intro-background); }
  .embedded #scene { height: var(--intro-height, 320px); width: 100%; }
  @media (max-width: 540px) {
    main { width: calc(100% - 28px); margin: 28px auto; }
    header { margin-bottom: 18px; }
    h1 { font-size: 21px; }
    .controls { grid-template-columns: auto auto 1fr; gap: 8px; }
    #clock { display: none; }
    footer { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">Portfolio Breakdown</p><h1>Intro animation</h1></div>
    <div class="palette" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>
  <div class="stage">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Breakdown lettering swirls counterclockwise into the Portfolio Breakdown logo">
      <!-- The final SVG below is copied directly from the original asset. -->
      <g id="canonical" transform="translate(340 100) scale(0.3125)">
        <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio Breakdown</title>
  <desc id="desc">Three allocation segments on a dark rounded-square tile. Transparent outside the tile.</desc>
  <!-- Generated by generate_icon.py. Edit icon.json and regenerate. -->
  <rect id="tile" x="72" y="72" width="880" height="880" rx="192" fill="#11151C"/>
  <!-- blue: 60% of the full circle before gaps -->
  <path id="segment-1" fill="#5470C6" d="M 831.453066,493.298701 A 320.000000,320.000000 0 1 0 242.564693,684.640133 A 12.000000,12.000000 0 0 0 259.721940,687.874332 L 344.077532,626.586407 A 12.000000,12.000000 0 0 0 347.316808,610.708897 A 192.000000,192.000000 0 1 1 703.251135,495.058824 A 12.000000,12.000000 0 0 0 715.204331,506.000000 L 819.473576,506.000000 A 12.000000,12.000000 0 0 0 831.453066,493.298701 Z"/>
  <!-- teal: 25% of the full circle before gaps -->
  <path id="segment-2" fill="#4AA9B3" d="M 264.549388,714.899470 A 320.000000,320.000000 0 0 0 684.640133,781.435307 A 12.000000,12.000000 0 0 0 687.874332,764.278060 L 626.586407,679.922468 A 12.000000,12.000000 0 0 0 610.708897,676.683192 A 192.000000,192.000000 0 0 1 367.232355,638.120296 A 12.000000,12.000000 0 0 0 351.130955,636.294611 L 266.775363,697.582535 A 12.000000,12.000000 0 0 0 264.549388,714.899470 Z"/>
  <!-- purple: 15% of the full circle before gaps -->
  <path id="segment-3" fill="#9A6DD7" d="M 714.899470,759.450612 A 320.000000,320.000000 0 0 0 831.453066,530.701299 A 12.000000,12.000000 0 0 0 819.473576,518.000000 L 715.204331,518.000000 A 12.000000,12.000000 0 0 0 703.251135,528.941176 A 192.000000,192.000000 0 0 1 638.120296,656.767645 A 12.000000,12.000000 0 0 0 636.294611,672.869045 L 697.582535,757.224637 A 12.000000,12.000000 0 0 0 714.899470,759.450612 Z"/>
</svg>
      </g>
      <svg id="assembling" x="340" y="100" width="320" height="320" viewBox="0 0 1024 1024" overflow="visible" aria-hidden="true" style="display:none">
        <defs id="revealMasks"></defs>
        <g id="assemblingTile"></g>
        <g id="assemblingRing"></g>
      </svg>
      <g id="trails" fill="none" stroke-linecap="round" aria-hidden="true"></g>
      <g id="letters" aria-hidden="true"></g>
    </svg>
  </div>
  <div class="controls" aria-label="Animation controls">
    <button id="replay" type="button">↺ Replay</button>
    <button id="pause" type="button">Pause</button>
    <label class="sr-only" for="timeline">Animation timeline</label>
    <input id="timeline" type="range" min="0" max="2800" step="1" value="0">
    <output id="clock" for="timeline">0.0 / 2.8 s</output>
  </div>
  <footer><span id="phase" role="status">Wordmark</span><span>Wordmark → counterclockwise swirl → original mark</span></footer>
</main>
<script>
(() => {
  "use strict";
  // No external fonts, libraries, network calls, or raster assets.
  const SVG_NS = "http://www.w3.org/2000/svg";
  const config = {"canvas_size": 1024, "tile_inset": 72, "tile_corner_radius": 192, "background": "#11151C", "outer_radius": 320, "ring_thickness": 128, "gap": 12, "segment_corner_radius": 12, "start_angle_degrees": 0, "counterclockwise": true, "segments": [{"name": "blue", "percentage": 60, "color": "#5470C6"}, {"name": "teal", "percentage": 25, "color": "#4AA9B3"}, {"name": "purple", "percentage": 15, "color": "#9A6DD7"}]};
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t); return t*t*t*(t*(t*6-15)+10); };
  const windowed = (v, a, b) => smooth((v-a)/(b-a));
  const tau = 2 * Math.PI;
  const center = {x: 500, y: 260};
  const ringRadius = (config.outer_radius - config.ring_thickness/2) * .3125;
  const canonical = $("canonical");
  const assembling = $("assembling");
  const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
  const embedded = true && window.parent !== window;
  if (embedded) {
    document.body.classList.add("embedded");
    document.documentElement.style.colorScheme = "normal";
  }

  const svgNode = (tag, attrs, parent) => {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    parent.appendChild(node);
    return node;
  };
  const tile = canonical.querySelector("rect").cloneNode(true);
  tile.removeAttribute("id");
  $("assemblingTile").appendChild(tile);
  const sourcePaths = [...canonical.querySelectorAll("path")];
  let angleStart = 0;
  const reveals = sourcePaths.map((path, i) => {
    const span = tau * config.segments[i].percentage / 100;
    const a = angleStart;
    const b = angleStart + span;
    const r = config.outer_radius - config.ring_thickness / 2;
    const p = (angle) => `${512+r*Math.cos(angle)},${512-r*Math.sin(angle)}`;
    const mask = svgNode("mask", {id: `sweep-${i}`, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1024, height: 1024}, $("revealMasks"));
    const stroke = svgNode("path", {
      d: `M ${p(a)} A ${r},${r} 0 ${span > Math.PI ? 1 : 0} 0 ${p(b)}`,
      fill: "none", stroke: "white", "stroke-width": config.ring_thickness + 48,
      "stroke-linecap": "round", pathLength: 1,
      "stroke-dasharray": "1 1", "stroke-dashoffset": 1
    }, mask);
    const copy = path.cloneNode(true);
    copy.removeAttribute("id");
    copy.setAttribute("mask", `url(#sweep-${i})`);
    $("assemblingRing").appendChild(copy);
    angleStart = b;
    return {stroke, copy, a, b};
  });

  const chars = [..."Breakdown"];
  const letters = chars.map((char, i) => {
    const group = i < 5 ? 0 : i < 8 ? 1 : 2;
    const color = config.segments[group].color;
    const text = svgNode("text", {x: 0, y: 0, fill: color}, $("letters"));
    text.textContent = char;
    const trail = svgNode("path", {stroke: color, opacity: 0}, $("trails"));
    return {text, trail, group, index: i, width: text.getComputedTextLength()};
  });
  const totalWidth = letters.reduce((s, l) => s+l.width, 0) - 8;
  let cursor = -totalWidth / 2;
  letters.forEach((l) => {
    l.x = cursor + l.width / 2;
    cursor += l.width - 1;
    const box = l.text.getBBox();
    l.baseline = -(box.y + box.height / 2);
    l.startAngle = l.x < 0 ? Math.PI : 0;
    const count = l.group === 0 ? 5 : l.group === 1 ? 3 : 1;
    const localIndex = l.index - (l.group === 0 ? 0 : l.group === 1 ? 5 : 8);
    const sector = reveals[l.group];
    let end = lerp(sector.a, sector.b, (localIndex+.5)/count);
    // Mathematical angles increase CCW. SVG's downward y is inverted here.
    while (end-l.startAngle < Math.PI * .8) end += tau;
    l.endAngle = end;
  });

  let holdMs = 950, swirlMs = 1850, elapsed = 0, lastTime = null, raf = 0;
  let playing = false, completed = false, runToken = null, reported = null;
  let respectReducedMotion = true;
  const duration = () => holdMs + swirlMs;
  const post = (type, payload = {}) => {
    if (embedded) window.parent.postMessage({isStreamlitMessage: true, type, ...payload}, "*");
  };
  const notifyDone = () => {
    if (runToken !== null && reported !== runToken) {
      reported = runToken;
      post("streamlit:setComponentValue", {value: runToken, dataType: "json"});
    }
  };
  const pose = (l, u) => {
    const p = smooth(u);
    const angle = lerp(l.startAngle, l.endAngle, p);
    const radius = lerp(Math.abs(l.x), ringRadius, smooth(u * 1.65));
    return {x: center.x + Math.cos(angle)*radius, y: center.y - Math.sin(angle)*radius,
      angle: -(angle-l.startAngle)*180/Math.PI, scale: lerp(1, .06, smooth(u * 1.65))};
  };
  function render(ms) {
    elapsed = clamp(ms, 0, duration());
    const u = clamp((elapsed-holdMs)/swirlMs);
    const done = elapsed >= duration();
    canonical.style.display = done ? "" : "none";
    assembling.style.display = done || u === 0 ? "none" : "";
    $("letters").style.display = done ? "none" : "";
    $("trails").style.display = done ? "none" : "";

    letters.forEach((l) => {
      const local = clamp((u-l.index*.008)/(1-l.index*.008));
      const p = pose(l, local);
      const opacity = 1 - windowed(local, .30, .74);
      l.text.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${p.angle*.72}) scale(${p.scale}) translate(0 ${l.baseline})`);
      l.text.setAttribute("opacity", opacity);
      const trailOpacity = windowed(local, .13, .32) * (1-windowed(local, .46, .74));
      const points = Array.from({length: 18}, (_, j) => pose(l, Math.max(0, local-.085+j*.085/17)));
      l.trail.setAttribute("d", points.map((q, j) => `${j ? "L" : "M"} ${q.x} ${q.y}`).join(" "));
      l.trail.setAttribute("stroke-width", lerp(1.5, 13, windowed(local, .15, .6)));
      l.trail.setAttribute("opacity", trailOpacity * .60);
    });
    const turn = 170 * (1-windowed(u, .18, 1));
    const scale = lerp(.72, 1, windowed(u, .25, 1));
    // A decreasing positive SVG angle rotates COUNTERCLOCKWISE toward zero.
    $("assemblingRing").setAttribute("transform", `translate(512 512) rotate(${turn}) scale(${scale}) translate(-512 -512)`);
    $("assemblingRing").setAttribute("opacity", windowed(u, .24, .58));
    $("assemblingTile").setAttribute("opacity", windowed(u, .58, .97));
    reveals.forEach((r, i) => {
      const progress = windowed(u, .20+i*.025, .85+i*.025);
      r.stroke.setAttribute("stroke-dashoffset", 1-progress);
      if (progress >= 1) r.copy.removeAttribute("mask");
      else r.copy.setAttribute("mask", `url(#sweep-${i})`);
    });
    $("timeline").max = duration();
    $("timeline").value = elapsed;
    $("clock").textContent = `${(elapsed/1000).toFixed(1)} / ${(duration()/1000).toFixed(1)} s`;
    const label = done ? "Original mark" : u === 0 ? "Wordmark" : "Counterclockwise swirl";
    if ($("phase").textContent !== label) $("phase").textContent = label;
    document.body.dataset.phase = done ? "done" : u === 0 ? "wordmark" : "swirl";
  }
  function stop() { cancelAnimationFrame(raf); playing = false; lastTime = null; $("pause").textContent = "Play"; }
  function finish(report = true) { stop(); render(duration()); completed = true; if (report) notifyDone(); }
  function tick(now) {
    if (!playing) return;
    if (lastTime !== null) render(elapsed + now-lastTime);
    lastTime = now;
    if (elapsed >= duration()) finish();
    else raf = requestAnimationFrame(tick);
  }
  function play(restart = false) {
    stop();
    if (respectReducedMotion && motionPreference.matches) { finish(); return; }
    if (restart || elapsed >= duration()) { elapsed = 0; completed = false; }
    render(elapsed);
    playing = true; $("pause").textContent = "Pause";
    raf = requestAnimationFrame(tick);
  }
  function seek(ms) { stop(); completed = false; render(ms); }
  $("replay").addEventListener("click", () => play(true));
  $("pause").addEventListener("click", () => playing ? stop() : play());
  $("timeline").addEventListener("input", (e) => seek(Number(e.target.value)));
  motionPreference.addEventListener("change", (e) => { if (e.matches && respectReducedMotion) finish(); });
  document.addEventListener("visibilitychange", () => { lastTime = null; });
  window.addEventListener("pagehide", stop);

  // Streamlit v1 bridge: no npm build or streamlit-component-lib dependency.
  window.addEventListener("message", (event) => {
    if (!embedded || event.source !== window.parent || event.data?.type !== "streamlit:render") return;
    const args = event.data.args || {};
    const height = clamp(Number(args.height) || 320, 120, 1000);
    document.documentElement.style.setProperty("--intro-height", `${height}px`);
    post("streamlit:setFrameHeight", {height});
    respectReducedMotion = args.reduced_motion !== false;
    const nextToken = String(args.run_token ?? "default");
    if (nextToken !== runToken) {
      runToken = nextToken; reported = null;
      holdMs = clamp(Number(args.hold_ms ?? 950), 0, 10000);
      swirlMs = clamp(Number(args.swirl_ms ?? 1850), 300, 10000);
      if (args.completed) finish(false);
      else play(true);
    } else if (args.completed && !completed) finish(false);
  });
  // Public controller is also useful for embedding outside Streamlit and QA.
  window.BreakdownIntro = {
    replay: () => play(true), pause: stop, play: () => play(), seek,
    finish: () => finish(),
    get duration() { return duration(); }, get elapsed() { return elapsed; },
    get playing() { return playing; }, get completed() { return completed; }
  };
  if (embedded) {
    // Keep the original mark visible until Streamlit sends its initial args.
    $("letters").style.display = "none";
    post("streamlit:componentReady", {apiVersion: 1});
  } else {
    play(true);
  }
})();
</script>
</body>
</html>
