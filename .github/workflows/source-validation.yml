name: Source validation
'on':
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    name: source-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          platform: linux-x64
        - os: windows-2022
          platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - run: uv run portfolio-check-private --tracked
    - run: uv run ruff check src tests tools
    - run: uv run python tools/release.py preflight
    - run: uv run playwright install --with-deps chromium
    - name: Installed wheel smoke
      run: |
        uv build --wheel
        uv venv "$RUNNER_TEMP/portfolio-installed"
        uv pip install --python "$RUNNER_TEMP/portfolio-installed" --no-deps dist/*.whl
        uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
        uv pip install --python "$RUNNER_TEMP/portfolio-installed" --requirements "$RUNNER_TEMP/runtime.txt"
        if [ "$RUNNER_OS" = Windows ]; then installed="$RUNNER_TEMP/portfolio-installed/Scripts/portfolio-app.exe"; else installed="$RUNNER_TEMP/portfolio-installed/bin/portfolio-app"; fi
        uv run python tools/package_smoke.py "$installed" --installation wheel --evidence "$RUNNER_TEMP/wheel-smoke"
    - name: Source application smoke before freezing
      run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/source-smoke"
    - name: Tests (including required browser suites)
      env:
        PORTFOLIO_REQUIRE_BROWSER: '1'
      run: uv run python tools/run_candidate_tests.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: source-evidence-${{ matrix.platform }}
        path: |-
          dist/candidate-tests/*.json
          dist/candidate-tests/*.xml
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-test-results-${{ matrix.platform }}
        path: |-
          dist/test-results.xml
          dist/candidate-tests/*.log
          dist/candidate-tests/*-browser-evidence
          ${{ runner.temp }}/source-smoke
          ${{ runner.temp }}/wheel-smoke
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
