name: Dependency audit
on:
  push:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/workflows/maintenance.yml]
  pull_request:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/workflows/maintenance.yml]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --group release
      - name: Audit locked runtime packages
        run: |
          uv export --locked --no-dev --extra window --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/portfolio-audit.txt"
          uv run pip-audit --disable-pip --require-hashes --no-deps -r "$RUNNER_TEMP/portfolio-audit.txt"
