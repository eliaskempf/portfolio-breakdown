name: Dependency audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --group release
      - name: Audit locked runtime packages
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/portfolio-audit.txt"
          uv run pip-audit --require-hashes --no-deps -r "$RUNNER_TEMP/portfolio-audit.txt"
