name: Build candidate
on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Focused checks only; installer-upgrade builds a Windows diagnostic package
        type: boolean
        default: false
      diagnostics_platforms:
        description: Platforms for diagnostics-only runs
        type: choice
        options: [all, windows, macos, macos15, macos26]
        default: all
      diagnostics_suite:
        description: Windows diagnostic suite (installer-upgrade skips the full test matrix)
        type: choice
        options: [navigation, rerun-sync, backup-startup, metric-toggle, installer-upgrade]
        default: navigation
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
jobs:
  build:
    if: ${{ !inputs.diagnostics_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade
      - name: Windows window runtime
        if: runner.os == 'Windows'
        run: uv run python tools/windows_bundle.py --ensure-runtime
      - run: uv run portfolio-check-private --tracked
      - run: uv run ruff check src tests tools
      - name: Source packages, documentation and license preflight
        run: uv run python tools/release.py preflight
      - run: uv run playwright install --with-deps chromium
      - name: Source application smoke before freezing
        run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/source-smoke"
      - name: Tests (including required browser suites)
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
        run: uv run python tools/run_candidate_tests.py
      - run: uv run python tools/release.py build
      - run: uv run python tools/release.py test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.platform }}
          overwrite: true # A retried platform replaces only its own earlier artifact.
          compression-level: 0 # Installers and package archives are already compressed.
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: candidate-windows-upgrade-evidence
          overwrite: true
          path: ${{ runner.temp }}/windows-upgrade-evidence
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: candidate-source-smoke-${{ matrix.platform }}
          overwrite: true
          path: ${{ runner.temp }}/source-smoke
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-test-results-${{ matrix.platform }}
          overwrite: true
          path: |
            dist/test-results.xml
            dist/candidate-tests/*.json
            dist/candidate-tests/*.xml
            dist/candidate-tests/*.log
            dist/candidate-tests/*-browser-evidence
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: candidate-windows-setup-evidence
          overwrite: true
          path: ${{ runner.temp }}/windows-setup-evidence
          if-no-files-found: ignore
          retention-days: 30
  linux-compatibility:
    if: ${{ !inputs.diagnostics_only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-linux-x64
          path: dist/candidate
      - run: uv sync --locked --group browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run python tools/release.py test
  windows-upgrade-diagnostic:
    if: ${{ inputs.diagnostics_only && inputs.diagnostics_suite == 'installer-upgrade' }}
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade
      - run: uv run python tools/windows_bundle.py --ensure-runtime
      - run: uv run playwright install chromium
      - name: Build focused Windows diagnostic package
        run: uv run python tools/release.py build
      - name: Verify fresh install and pinned previous-version upgrade
        run: uv run python tools/release.py test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-upgrade-diagnostic
          path: |
            ${{ runner.temp }}/windows-setup-evidence
            ${{ runner.temp }}/windows-upgrade-evidence
            dist/candidate/manifest.json
          if-no-files-found: error
          retention-days: 14
  diagnostics:
    if: ${{ inputs.diagnostics_only && inputs.diagnostics_suite != 'installer-upgrade' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.diagnostics_platforms == 'macos15' && '["macos-15"]' || inputs.diagnostics_platforms == 'macos26' && '["macos-26"]' || inputs.diagnostics_platforms == 'macos' && '["macos-15","macos-26"]' || inputs.diagnostics_platforms == 'windows' && '["windows-2022"]' || '["windows-2022","macos-15","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      PORTFOLIO_TEST_HOSTED_INPUT: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: ${{ runner.os == 'macOS' && '3.13' || '3.12' }}
      - run: uv sync --locked --extra window --all-groups
      - name: Windows synthetic navigation regressions
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'navigation'
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/browser
        run: |
          uv run playwright install chromium
          uv run pytest tests/test_backup_browser.py tests/test_position_entry_browser.py tests/test_tour_browser.py tests/test_intro_browser.py::test_intro_welcome_navigation_and_help tests/test_report_download_browser.py -q --junitxml="$RUNNER_TEMP/release-diagnostics/browser.xml"
      - name: Windows slow-render regressions
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'navigation' && !cancelled()
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_TEST_CPU_RATE: '4'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/slow-browser
        run: uv run pytest tests/test_backup_browser.py::test_archive_review_cancel_switch_restart_and_tabs tests/test_position_entry_browser.py::test_search_selection_and_settings_help tests/test_tour_browser.py::test_demo_tour_every_view_and_menu_replay tests/test_tour_browser.py::test_help_chevron_keeps_menu_open tests/test_intro_browser.py::test_intro_welcome_navigation_and_help tests/test_report_download_browser.py -q --junitxml="$RUNNER_TEMP/release-diagnostics/slow-browser.xml"
      - name: Windows backup startup diagnosis
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'backup-startup'
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_TEST_CPU_RATE: '4'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/backup-startup
        run: |
          uv run playwright install chromium
          uv run pytest tests/test_backup_browser.py::test_archive_review_cancel_switch_restart_and_tabs -q --basetemp="$RUNNER_TEMP/backup-startup-workspace" --junitxml="$RUNNER_TEMP/release-diagnostics/backup-startup.xml"
      - name: Windows interaction and readiness regressions
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'metric-toggle'
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/metric-toggle
        run: |
          uv run playwright install chromium
          uv run pytest tests/test_metric_toggle_browser.py tests/test_history_download_browser.py tests/test_ux_browser.py::test_category_scope_performance_and_tab_roundtrip tests/test_ux_browser.py::test_personal_history_is_visible_with_periods_ending_today tests/test_ux_browser.py::test_automatic_early_finish_retires_only_its_covered_request tests/test_ux_browser.py::test_nonautomatic_early_finish_keeps_user_request_pending tests/test_ux_browser.py::test_automatic_early_finish_cannot_hide_an_active_text_conflict tests/test_portfolio_exposure_browser.py::test_normal_and_sandbox_exposure_controls tests/test_futures_freshness_browser.py::test_stale_fresh_failure_settlement_and_popup_navigation tests/test_refresh_stability_browser.py::test_session_transitions_and_unsaved_editor_survive_ticks tests/test_csv_transaction_import_browser.py::test_listing_popup_search_selection_dismissal_and_navigation tests/test_csv_transaction_import_browser.py::test_partial_fills_share_one_optional_group_and_apply_together tests/test_interface_workflows_browser.py -q --basetemp="$RUNNER_TEMP/metric-toggle-workspace" --junitxml="$RUNNER_TEMP/release-diagnostics/metric-toggle.xml"
      - name: Windows rerun synchronization regressions
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'rerun-sync'
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/rerun-browser
        run: |
          uv run playwright install chromium
          uv run pytest tests/test_ux_browser.py -q -k 'text_commit or navigation or readiness_timeout or baseline_full or unsolicited_full or full_request or automatic_early or transaction_review_defaults' --junitxml="$RUNNER_TEMP/release-diagnostics/rerun-browser.xml"
      - name: Windows source application smoke
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'rerun-sync' && !cancelled()
        run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/release-diagnostics/source-smoke"
      - name: Windows slow rerun synchronization regressions
        if: runner.os == 'Windows' && inputs.diagnostics_suite == 'rerun-sync' && !cancelled()
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_TEST_CPU_RATE: '4'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/slow-rerun-browser
        run: uv run pytest tests/test_ux_browser.py -q -k 'text_commit or navigation or readiness_timeout or baseline_full or unsolicited_full or full_request or automatic_early or transaction_review_defaults' --junitxml="$RUNNER_TEMP/release-diagnostics/slow-rerun-browser.xml"
      - name: Mac native source controls
        if: runner.os == 'macOS'
        env:
          PORTFOLIO_TEST_PANEL_EVIDENCE: '1'
        run: |
          failed=0
          for mode in render desktop; do
            for attempt in 1 2 3; do
              uv run portfolio-window --native-self-test "$RUNNER_TEMP/release-diagnostics/native-$mode-$attempt" "$mode" || failed=1
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/release-diagnostics
            ${{ runner.temp }}/backup-startup-workspace/**/synthetic-server.log
            ${{ runner.temp }}/metric-toggle-workspace/**/server.log
          if-no-files-found: warn
          retention-days: 7
