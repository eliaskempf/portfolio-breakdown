name: Build candidate
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade
      - name: Windows window runtime
        if: runner.os == 'Windows'
        run: uv run python tools/windows_bundle.py --ensure-runtime
      - run: uv run portfolio-check-private --tracked
      - run: uv run ruff check src tests tools
      - name: Source packages, documentation and license preflight
        run: uv run python tools/release.py preflight
      - run: uv run playwright install --with-deps chromium
      - name: Tests (including required browser suites)
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
        run: uv run pytest -v --durations=20 --junitxml=dist/test-results.xml
      - name: Source application smoke before freezing
        run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/source-smoke"
      - run: uv run python tools/release.py build
      - run: uv run python tools/release.py test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.platform }}
          overwrite: true # A retried platform replaces only its own earlier artifact.
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: candidate-source-smoke-${{ matrix.platform }}
          overwrite: true
          path: ${{ runner.temp }}/source-smoke
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-test-results-${{ matrix.platform }}
          overwrite: true
          path: dist/test-results.xml
          retention-days: 30
  linux-compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-linux-x64
          path: dist/candidate
      - run: uv sync --locked --group browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run python tools/release.py test
