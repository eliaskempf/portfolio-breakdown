name: Build candidate
'on':
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed CI/source-validation run at this exact commit; empty runs source validation here
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
jobs:
  source:
    if: inputs.source_run == ''
    uses: ./.github/workflows/source-validation.yml
  source-reuse:
    if: inputs.source_run != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN: ${{ inputs.source_run }}
      run: |-
        mkdir -p dist/source-reference
        uv run python tools/release_evidence.py source --run-id "$SOURCE_RUN" > dist/source-reference/source.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: source-reference
        path: dist/source-reference/source.json
        overwrite: true
        if-no-files-found: error
        retention-days: 30
  build-linux-x64:
    needs:
    - source
    - source-reuse
    if: ${{ always() && !cancelled() && (needs.source.result == 'success' || needs.source-reuse.result == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - run: uv run python tools/release.py build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unaccepted-linux-x64
        path: dist/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
  accept-linux-x64-packaged-browser:
    needs: build-linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-linux-x64
        path: dist/candidate
    - run: uv run playwright install --with-deps chromium
    - run: uv run python tools/release_evidence.py accept --stage packaged-browser --evidence dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-linux-x64-packaged-browser
        path: dist/acceptance
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: ${{ !cancelled() && needs['build-linux-x64'].result == 'success' }}
  accepted-linux-x64:
    needs:
    - accept-linux-x64-packaged-browser
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-linux-x64
        path: dist/candidate
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-linux-x64
        path: dist/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    if: ${{ !cancelled() && needs['accept-linux-x64-packaged-browser'].result == 'success' }}
  build-windows-x64:
    needs:
    - source
    - source-reuse
    if: ${{ always() && !cancelled() && (needs.source.result == 'success' || needs.source-reuse.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade
    - run: uv run python tools/windows_bundle.py --ensure-runtime
    - run: uv run python tools/release.py build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unaccepted-windows-x64
        path: dist/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
  accept-windows-x64-packaged-browser:
    needs: build-windows-x64
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-windows-x64
        path: dist/candidate
    - run: uv run playwright install --with-deps chromium
    - run: uv run python tools/release_evidence.py accept --stage packaged-browser --evidence dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-windows-x64-packaged-browser
        path: dist/acceptance
        overwrite: true
