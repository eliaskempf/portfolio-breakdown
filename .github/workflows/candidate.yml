      with:
        name: acceptance-windows-x64-native-startup
        path: dist/acceptance
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: ${{ !cancelled() && needs['build-windows-x64'].result == 'success' }}
  accept-windows-x64-native-interaction:
