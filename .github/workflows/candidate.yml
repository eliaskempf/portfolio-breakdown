name: Build candidate
on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Focused Windows browser and Mac native source checks; no installers
        type: boolean
        default: false
      diagnostics_platforms:
        description: Platforms for diagnostics-only runs
        type: choice
        options: [all, windows, macos, macos14, macos26]
        default: all
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
jobs:
  build:
    if: ${{ !inputs.diagnostics_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade
      - name: Windows window runtime
        if: runner.os == 'Windows'
        run: uv run python tools/windows_bundle.py --ensure-runtime
      - run: uv run portfolio-check-private --tracked
      - run: uv run ruff check src tests tools
      - name: Source packages, documentation and license preflight
        run: uv run python tools/release.py preflight
      - run: uv run playwright install --with-deps chromium
      - name: Tests (including required browser suites)
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
        run: uv run pytest -v --durations=20 --junitxml=dist/test-results.xml
      - name: Source application smoke before freezing
        run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/source-smoke"
      - run: uv run python tools/release.py build
      - run: uv run python tools/release.py test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.platform }}
          overwrite: true # A retried platform replaces only its own earlier artifact.
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: candidate-source-smoke-${{ matrix.platform }}
          overwrite: true
          path: ${{ runner.temp }}/source-smoke
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-test-results-${{ matrix.platform }}
          overwrite: true
          path: dist/test-results.xml
          retention-days: 30
  linux-compatibility:
    if: ${{ !inputs.diagnostics_only }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-linux-x64
          path: dist/candidate
      - run: uv sync --locked --group browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run python tools/release.py test
  diagnostics:
    if: ${{ inputs.diagnostics_only }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.diagnostics_platforms == 'macos14' && '["macos-14"]' || inputs.diagnostics_platforms == 'macos26' && '["macos-26"]' || inputs.diagnostics_platforms == 'macos' && '["macos-14","macos-15","macos-26"]' || inputs.diagnostics_platforms == 'windows' && '["windows-2022"]' || '["windows-2022","macos-14","macos-15","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      PORTFOLIO_TEST_HOSTED_INPUT: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: ${{ runner.os == 'macOS' && '3.13' || '3.12' }}
      - run: uv sync --locked --extra window --all-groups
      - name: Windows synthetic navigation regressions
        if: runner.os == 'Windows'
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/browser
        run: |
          uv run playwright install chromium
          uv run pytest tests/test_backup_browser.py tests/test_position_entry_browser.py tests/test_tour_browser.py -q --junitxml="$RUNNER_TEMP/release-diagnostics/browser.xml"
      - name: Windows slow-render regressions
        if: runner.os == 'Windows' && !cancelled()
        env:
          PORTFOLIO_REQUIRE_BROWSER: '1'
          PORTFOLIO_TEST_CPU_RATE: '4'
          PORTFOLIO_BROWSER_EVIDENCE: ${{ runner.temp }}/release-diagnostics/slow-browser
        run: uv run pytest tests/test_backup_browser.py::test_archive_review_cancel_switch_restart_and_tabs tests/test_position_entry_browser.py::test_search_selection_and_settings_help tests/test_tour_browser.py::test_demo_tour_every_view_and_menu_replay tests/test_tour_browser.py::test_help_chevron_keeps_menu_open -q --junitxml="$RUNNER_TEMP/release-diagnostics/slow-browser.xml"
      - name: Mac native source controls
        if: runner.os == 'macOS'
        env:
          PORTFOLIO_TEST_PANEL_EVIDENCE: '1'
        run: |
          failed=0
          for mode in render desktop; do
            for attempt in 1 2 3; do
              uv run portfolio-window --native-self-test "$RUNNER_TEMP/release-diagnostics/native-$mode-$attempt" "$mode" || failed=1
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/release-diagnostics
          if-no-files-found: warn
          retention-days: 7
