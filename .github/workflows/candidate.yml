    - run: uv sync --locked --all-groups
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-windows-x64
        path: dist/candidate
    - run: uv run playwright install --with-deps chromium
    - run: uv run python tools/release_evidence.py accept --stage native-interaction --evidence dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-windows-x64-native-interaction
        path: dist/acceptance
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: ${{ !cancelled() && needs['build-windows-x64'].result == 'success' }}
