    - run: uv run playwright install --with-deps chromium
    - run: uv run python tools/release_evidence.py accept --stage installer --evidence dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-windows-x64-installer
        path: dist/acceptance
        overwrite: true
        if-no-files-found: error
