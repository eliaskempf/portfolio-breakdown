name: Publish reviewed documentation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source SHA (must include documentation tooling)
        required: true
        type: string
      channel:
        description: Build development or frozen candidate documentation
        type: choice
        options: [dev, candidate]
        default: candidate
      release_version:
        description: Optional release alias for an ALREADY archived candidate; copies existing bytes without building
        type: string
      candidate_run:
        description: Successful Build candidate run for frozen documentation (required for candidate channel)
        type: string
      acceptance:
        description: I approved publication, matched app/docs source, reviewed the archive and completed documentation acceptance
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    # Intentionally dormant. Do not set this variable or enable Pages in this task.
    if: vars.DOCS_PUBLISH_APPROVED == 'true' && inputs.acceptance && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CHANNEL: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
    steps:
      - name: Validate publication inputs
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DOCS_BASE_URL" =~ ^https://[^/]+/.*/$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --group docs
      - name: Restore the durable gh-pages archive
        run: |
          mkdir -p dist/pages
          git -C dist/pages init
          git -C dist/pages remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if git -C dist/pages ls-remote --exit-code origin refs/heads/gh-pages; then
            git -C dist/pages fetch --depth=1 origin gh-pages
            git -C dist/pages checkout -B gh-pages FETCH_HEAD
          else
            probe_status=$?
            if [ "$probe_status" -ne 2 ]; then
              echo "::error::Cannot check the gh-pages archive (git exit $probe_status). Publication stopped."
              exit "$probe_status"
            fi
            git -C dist/pages checkout --orphan gh-pages
          fi
      - name: Build a reviewed source or promote already archived bytes
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            uv run python tools/docs_site.py promote dist/pages --source-sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
          elif [ "$CHANNEL" = candidate ]; then
            [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
            gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name candidate-linux-x64 --dir dist/docs-candidate
            uv run python tools/docs_candidate.py --run-id "$CANDIDATE_RUN" --source-sha "$SOURCE_SHA"
            uv run python tools/docs_site.py assemble dist/docs-site dist/pages
          else
            uv run python tools/docs_site.py build --channel "$CHANNEL" --base-url "$DOCS_BASE_URL"
            uv run python tools/docs_site.py assemble dist/docs-site dist/pages
          fi
      - name: Check every retained documentation version
        run: |
          uv run python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          manifests = list(Path('dist/pages').rglob('build-info.json'))
          assert manifests, 'No versioned documentation to publish'
          for manifest in manifests:
              subprocess.run([sys.executable, 'tools/docs_site.py', 'check', str(manifest.parent)], check=True)
          PY
      - name: Commit the reviewed static archive to gh-pages
        run: |
          git -C dist/pages config user.name 'github-actions[bot]'
          git -C dist/pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dist/pages add .
          if ! git -C dist/pages diff --cached --quiet; then
            git -C dist/pages commit -m "Publish reviewed documentation for $SOURCE_SHA"
            git -C dist/pages push origin gh-pages
          fi
          # Pages receives static output, never Git metadata.
          rm -rf dist/pages/.git
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-pages-archive
          path: dist/pages
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the reviewed archive
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
