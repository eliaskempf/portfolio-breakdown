name: Experimental desktop candidates
'on':
  workflow_dispatch:
    inputs:
      build_platforms:
        description: Installer platforms to build and test
        type: choice
        options:
        - all
        - macos
        - linux
        default: all
      diagnostics_only:
        description: Run focused source diagnostics without building installers
        type: boolean
        default: false
      mac_candidate_run:
        description: Reuse a Mac installer for one Launch Services and native acceptance check
        type: string
        default: ''
      linux_candidate_run:
        description: Optional workflow run ID whose Linux installer should receive native crash diagnostics
        type: string
        default: ''
      source_run:
        description: Successful source-validation/CI run at this exact source commit (required for builds)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-experiment-${{ github.sha }}-${{ inputs.diagnostics_only || false }}
  cancel-in-progress: true
env:
  PORTFOLIO_TEST_HOSTED_INPUT: '1'
  PORTFOLIO_TEST_PANEL_EVIDENCE: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  diagnostics:
    if: ${{ inputs.diagnostics_only && inputs.linux_candidate_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mac_candidate_run != '' && '["macos-15"]' || '["macos-15","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.13'
    - run: uv sync --locked --extra window --all-groups
    - run: uv run playwright install --with-deps chromium
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: ${{ runner.os == 'macOS' && inputs.mac_candidate_run != '' }}
      with:
        name: unaccepted-macos-arm64
        path: dist/diagnostic-candidate
        run-id: ${{ inputs.mac_candidate_run }}
        github-token: ${{ github.token }}
    - name: Install existing diagnostic candidate
      if: ${{ runner.os == 'macOS' && inputs.mac_candidate_run != '' }}
      run: |
        cd dist/diagnostic-candidate
        shasum -a 256 -c SHA256SUMS
        mkdir -p "$RUNNER_TEMP/diagnostic-mount" "$RUNNER_TEMP/diagnostic-installed"
        hdiutil attach ./*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/diagnostic-mount"
        ditto "$RUNNER_TEMP/diagnostic-mount/Portfolio Breakdown Experimental.app" "$RUNNER_TEMP/diagnostic-installed/Portfolio Breakdown Experimental.app"
        hdiutil detach "$RUNNER_TEMP/diagnostic-mount"
        codesign --verify --deep --strict "$RUNNER_TEMP/diagnostic-installed/Portfolio Breakdown Experimental.app"
    - name: Linux diagnostic desktop
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb weston libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0
    - name: Native source controls
      if: runner.os == 'macOS'
      timeout-minutes: 3
      run: uv run portfolio-window --native-self-test "$RUNNER_TEMP/diagnostics/native" desktop
    - name: Wayland source controls
      if: runner.os == 'Linux'
      run: xvfb-run -a uv run python tools/desktop_session.py wayland .venv/bin/portfolio-window --output "$RUNNER_TEMP/diagnostics/wayland"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && runner.os == 'macOS' }}
      with:
        name: desktop-diagnostics-native-macos
        path: ${{ runner.temp }}/diagnostics/native
        retention-days: '14'
    - name: Existing Mac installer launch and native acceptance
      if: ${{ runner.os == 'macOS' && inputs.mac_candidate_run != '' && !cancelled() }}
      run: |
        uv run python tools/desktop_smoke.py "$RUNNER_TEMP/diagnostic-installed/Portfolio Breakdown Experimental.app" --launch-services --output "$RUNNER_TEMP/diagnostics/launch-services"
        uv run python tools/desktop_smoke.py "$RUNNER_TEMP/diagnostic-installed/Portfolio Breakdown Experimental.app/Contents/MacOS/portfolio-window" --desktop --output "$RUNNER_TEMP/diagnostics/installed-native"
    - name: Repeated synthetic browser workflow
      if: ${{ runner.os == 'macOS' && inputs.mac_candidate_run == '' && !cancelled() }}
      run: |
        failed=0
        for attempt in 1 2 3 4 5; do
          uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/diagnostics/browser-$attempt" > "$RUNNER_TEMP/diagnostics/browser-$attempt.log" 2>&1 || failed=1
        done
        exit "$failed"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: desktop-diagnostics-${{ matrix.os }}
        path: ${{ runner.temp }}/diagnostics
        retention-days: '14'
  linux-diagnostics:
    if: ${{ inputs.diagnostics_only && inputs.linux_candidate_run != '' }}
    strategy:
      fail-fast: false
      matrix:
        backend:
        - x11
        - wayland
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --extra window --all-groups
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-linux-native-x64
        path: dist/diagnostic-linux
        run-id: ${{ inputs.linux_candidate_run }}
        github-token: ${{ github.token }}
    - run: |
        sudo apt-get update
        sudo apt-get install -y gdb xvfb openbox weston x11-utils libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0
        cd dist/diagnostic-linux
        sha256sum -c SHA256SUMS
        sudo apt-get install -y ./*.deb
    - name: Repeat installed native checks with crash backtraces
      id: frozen
      continue-on-error: true
      run: xvfb-run -a uv run python tools/desktop_session.py ${{ matrix.backend }} /opt/portfolio-breakdown-experimental/portfolio-window
        --native-repeats 3 --output "$RUNNER_TEMP/linux-diagnostics/frozen"
    - name: Repeat source native checks with window-manager evidence
      id: source
      continue-on-error: true
      run: xvfb-run -a uv run python tools/desktop_session.py ${{ matrix.backend }} .venv/bin/portfolio-window --native-repeats
        3 --output "$RUNNER_TEMP/linux-diagnostics/source"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: desktop-linux-diagnostics-${{ matrix.backend }}
        path: ${{ runner.temp }}/linux-diagnostics
        retention-days: '14'
    - if: steps.frozen.outcome == 'failure' || steps.source.outcome == 'failure'
      run: exit 1
  linux-compatibility:
    name: linux-compatibility-${{ matrix.backend }}
    if: ${{ !inputs.diagnostics_only && inputs.build_platforms != 'macos' }}
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend:
        - x11
        - wayland
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_DEBUG: verbose
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-linux-native-x64
        path: dist/downloaded
    - run: uv sync --locked --extra window --all-groups
    - run: |
        sudo apt-get update
        sha256sum -c SHA256SUMS
        sudo apt-get install -y xvfb openbox weston x11-utils ./*.deb
      working-directory: dist/downloaded
    - run: uv run playwright install --with-deps chromium
    - run: |
        if [ "${{ matrix.backend }}" = x11 ]; then
          xvfb-run -a uv run python tools/desktop_session.py x11 /opt/portfolio-breakdown-experimental/portfolio-window --output "$RUNNER_TEMP/compat-native"
        else
          xvfb-run -a uv run python tools/desktop_session.py wayland /opt/portfolio-breakdown-experimental/portfolio-window --output "$RUNNER_TEMP/compat-native"
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: desktop-evidence-linux-24-${{ matrix.backend }}
        path: ${{ runner.temp }}/compat-native
        retention-days: '14'
    - run: uv run python tools/release_evidence.py record --directory dist/downloaded --stage native --evidence dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-linux-compatibility-${{ matrix.backend }}
        path: dist/acceptance
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
  macos-compatibility:
    name: macos-compatibility-${{ matrix.os }}
    if: ${{ !inputs.diagnostics_only && inputs.build_platforms != 'linux' }}
    needs: build-macos-arm64
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.13'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-macos-arm64
        path: dist/downloaded
    - run: uv sync --locked --all-groups
    - run: uv run playwright install chromium
    - name: Verify and install the macOS 15-built DMG
      run: |
        cd dist/downloaded
        shasum -a 256 -c SHA256SUMS
        mkdir -p "$RUNNER_TEMP/desktop-mount" "$RUNNER_TEMP/desktop-installed"
        hdiutil attach ./*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/desktop-mount"
        ditto "$RUNNER_TEMP/desktop-mount/Portfolio Breakdown Experimental.app" "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app"
        hdiutil detach "$RUNNER_TEMP/desktop-mount"
        codesign --verify --deep --strict "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app"
    - name: Installed native and application checks
      run: uv run python tools/desktop_smoke.py "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app/Contents/MacOS/portfolio-window"
        --desktop --output "$RUNNER_TEMP/compat-native"
    - name: Unsigned Gatekeeper behavior
      if: ${{ success() }}
      run: uv run python tools/desktop_gatekeeper.py "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app"
        --output "$RUNNER_TEMP/gatekeeper"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: desktop-evidence-${{ matrix.os }}
        overwrite: 'true'
        path: |
          ${{ runner.temp }}/compat-native
          ${{ runner.temp }}/gatekeeper/*.json
          ${{ runner.temp }}/gatekeeper/*.log
        retention-days: '14'
    - run: uv run python tools/release_evidence.py record --directory dist/downloaded --stage native --evidence dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-macos-compatibility-${{ matrix.os }}
        path: dist/acceptance
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
  source-gate:
    if: ${{ !inputs.diagnostics_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --all-groups
    - env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN: ${{ inputs.source_run }}
      run: |-
        mkdir -p dist/source-reference
        uv run python tools/release_evidence.py source --run-id "$SOURCE_RUN" > dist/source-reference/source.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: source-reference
        path: dist/source-reference/source.json
        overwrite: true
        if-no-files-found: error
        retention-days: 30
  build-linux-x64:
    name: build-linux-x64
    needs: source-gate
    if: ${{ !inputs.diagnostics_only && inputs.build_platforms != 'macos' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_DEBUG: verbose
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --extra window --all-groups
    - run: uv run portfolio-check-private --tracked
    - run: uv run ruff check src tests tools
    - name: Source packages, documentation and license preflight
      run: uv run python tools/release.py preflight
    - name: POSIX policy and containment tests
      run: uv run pytest tests/test_posix_desktop.py -q --junitxml=dist/posix-results.xml
    - name: Linux native display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb openbox x11-utils libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0
    - name: Verify native GUI session before packaging
      id: source_native
      timeout-minutes: 3
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a uv run --extra window portfolio-window --native-self-test "$RUNNER_TEMP/source-native" render
        else
          uv run --extra window portfolio-window --native-self-test "$RUNNER_TEMP/source-native" render
        fi
    - run: uv run playwright install --with-deps chromium
    - name: Native lifecycle tests with the window extra
      run: uv run pytest tests/test_window.py tests/test_window_lifecycle.py tests/test_window_build.py tests/test_launcher.py -q --junitxml=dist/unit-results.xml
    - name: Source application smoke before freezing
      run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/source-smoke"
    - run: uv run python tools/desktop_build.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unaccepted-linux-native-x64
        path: dist/desktop-experiment/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-source-linux-x64
        path: |-
          dist/*-results.xml
          ${{ runner.temp }}/source-native
          ${{ runner.temp }}/source-smoke
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
  accept-linux-x64:
    name: accept-linux-x64
    needs: build-linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_DEBUG: verbose
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.12'
    - run: uv sync --locked --extra window --all-groups
    - name: Linux native display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb openbox x11-utils libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-linux-native-x64
        path: dist/desktop-experiment/candidate
    - run: uv run playwright install --with-deps chromium
    - name: Install Linux artifact and test native binary
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install -y ./dist/desktop-experiment/candidate/*.deb
        xvfb-run -a uv run python tools/desktop_session.py x11 /opt/portfolio-breakdown-experimental/portfolio-window --output "$RUNNER_TEMP/installed-native"
        uv run python - <<'PY'
        import json, os, sys
        from pathlib import Path
        sys.path.insert(0, 'tools')
        from history_package_smoke import create_acceptance_workspace
        from release import workspace_hashes
        root = Path(os.environ['RUNNER_TEMP'])
        workspace = root / 'upgrade-workspace'
        create_acceptance_workspace(workspace)
        (root / 'preserved-workspace.json').write_text(json.dumps(workspace_hashes(workspace), sort_keys=True))
        PY
        sudo apt-get install --reinstall -y ./dist/desktop-experiment/candidate/*.deb
        sudo apt-get remove -y portfolio-breakdown-experimental
        uv run python - <<'PY'
        import json, os, sys
        from pathlib import Path
        sys.path.insert(0, 'tools')
        from release import workspace_hashes
        root = Path(os.environ['RUNNER_TEMP'])
        assert workspace_hashes(root / 'upgrade-workspace') == json.loads((root / 'preserved-workspace.json').read_text()), 'Reinstall/removal changed the complete synthetic history workspace'
        print('Linux reinstall/removal preserved every synthetic workspace file, including history/account/import evidence.')
        PY
        test ! -e /opt/portfolio-breakdown-experimental/portfolio-window
    - run: uv run python tools/release_evidence.py record --directory dist/desktop-experiment/candidate --stage native --evidence
        dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-linux-native-x64-native
        path: |-
          dist/acceptance
          ${{ runner.temp }}/installed-native
          ${{ runner.temp }}/launch-services-native
          ${{ runner.temp }}/gatekeeper
          ${{ runner.temp }}/preserved-workspace.json
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-linux-native-x64
        path: dist/desktop-experiment/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
  build-macos-arm64:
    name: build-macos-arm64
    needs: source-gate
    if: ${{ !inputs.diagnostics_only && inputs.build_platforms != 'linux' }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_DEBUG: verbose
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.13'
    - run: uv sync --locked --extra window --all-groups
    - run: uv run portfolio-check-private --tracked
    - run: uv run ruff check src tests tools
    - name: Source packages, documentation and license preflight
      run: uv run python tools/release.py preflight
    - name: POSIX policy and containment tests
      run: uv run pytest tests/test_posix_desktop.py -q --junitxml=dist/posix-results.xml
    - name: Linux native display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb openbox x11-utils libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0
    - name: Verify native GUI session before packaging
      id: source_native
      timeout-minutes: 3
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a uv run --extra window portfolio-window --native-self-test "$RUNNER_TEMP/source-native" render
        else
          uv run --extra window portfolio-window --native-self-test "$RUNNER_TEMP/source-native" render
        fi
    - run: uv run playwright install --with-deps chromium
    - name: Application and lifecycle unit tests
      run: uv run pytest -v --durations=20 --ignore-glob='*browser.py' --ignore=tests/test_posix_desktop.py --junitxml=dist/unit-results.xml
    - name: Source application smoke before freezing
      run: uv run python tools/package_smoke.py --evidence "$RUNNER_TEMP/source-smoke"
    - run: uv run python tools/desktop_build.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unaccepted-macos-arm64
        path: dist/desktop-experiment/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-source-macos-arm64
        path: |-
          dist/*-results.xml
          ${{ runner.temp }}/source-native
          ${{ runner.temp }}/source-smoke
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
  accept-macos-arm64:
    name: accept-macos-arm64
    needs: build-macos-arm64
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_DEBUG: verbose
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.12.10
        python-version: '3.13'
    - run: uv sync --locked --extra window --all-groups
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unaccepted-macos-arm64
        path: dist/desktop-experiment/candidate
    - run: uv run playwright install --with-deps chromium
    - name: Copy Mac app from DMG and test installed binary
      if: runner.os == 'macOS'
      run: |
        mkdir -p "$RUNNER_TEMP/desktop-mount" "$RUNNER_TEMP/desktop-installed"
        hdiutil attach dist/desktop-experiment/candidate/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/desktop-mount"
        ditto "$RUNNER_TEMP/desktop-mount/Portfolio Breakdown Experimental.app" "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app"
        hdiutil detach "$RUNNER_TEMP/desktop-mount"
        codesign --verify --deep --strict "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app"
        uv run python tools/desktop_smoke.py "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app" --launch-services --output "$RUNNER_TEMP/launch-services-native"
        uv run python tools/desktop_smoke.py "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app/Contents/MacOS/portfolio-window" --desktop --output "$RUNNER_TEMP/installed-native"
    - name: Verify unsigned Gatekeeper behavior
      if: runner.os == 'macOS' && success()
      run: uv run python tools/desktop_gatekeeper.py "$RUNNER_TEMP/desktop-installed/Portfolio Breakdown Experimental.app"
        --output "$RUNNER_TEMP/gatekeeper"
    - run: uv run python tools/release_evidence.py record --directory dist/desktop-experiment/candidate --stage native --evidence
        dist/acceptance
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-macos-arm64-native
        path: |-
          dist/acceptance
          ${{ runner.temp }}/installed-native
          ${{ runner.temp }}/launch-services-native
          ${{ runner.temp }}/gatekeeper
          ${{ runner.temp }}/preserved-workspace.json
        overwrite: true
        if-no-files-found: error
        retention-days: 30
      if: always()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-macos-arm64
        path: dist/desktop-experiment/candidate/*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
