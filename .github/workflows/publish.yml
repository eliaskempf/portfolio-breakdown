name: Publish tested candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful candidate run ID from the default branch
        required: true
        type: string
      linux_native_candidate_run:
        description: Desktop workflow run with tested Ubuntu .deb at the same commit
        required: true
        type: string
      acceptance:
        description: Windows manual and Linux automated acceptance passed for these exact candidate bytes
        required: true
        default: false
        type: boolean
      macos_candidate_run:
        description: Desktop workflow run at the same commit; leave empty to defer macOS
        type: string
        default: ''
      experimental_macos:
        description: Include experimental Apple Silicon DMG with signing and manual-installation limitations disclosed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.acceptance && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and promote existing artifacts (no build or dependency install)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          LINUX_NATIVE_RUN: ${{ inputs.linux_native_candidate_run }}
          MACOS_RUN: ${{ inputs.macos_candidate_run }}
          EXPERIMENTAL_MACOS: ${{ inputs.experimental_macos }}
        run: |
          args=(--run-id "$CANDIDATE_RUN" --linux-native-run-id "$LINUX_NATIVE_RUN" --acceptance tested-on-windows-and-linux)
          if [ -n "$MACOS_RUN" ]; then args+=(--macos-run-id "$MACOS_RUN"); fi
          if [ "$EXPERIMENTAL_MACOS" = true ]; then args+=(--experimental-macos); fi
          python3 tools/promote.py "${args[@]}"
