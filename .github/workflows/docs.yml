name: Documentation
on:
  # Temporary budget pause; local documentation review still applies to changes.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --locked --group docs --group browser
      - name: Require an explicit documentation impact review
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uv run python - <<'PY'
          import os, re
          body = os.environ['PR_BODY']
          assert re.search(r'^Docs impact: (updated|none)\s*$', body, re.M), 'Add Docs impact: updated or none to the PR body'
          assert re.search(r'^Docs review: \S[^\n]{15,}$', body, re.M), 'Add Docs review: with affected topics/evidence or why no guide changes are needed'
          PY
      - run: uv run mkdocs build --strict
      - run: uv run python tools/docs_site.py check dist/docs-site
      - run: uv run pytest -q tests/test_documentation.py tests/test_privacy.py tests/test_workspace.py tests/test_demo.py tests/test_imports.py
      - run: uv run portfolio-check-private --tracked
      - run: uv run playwright install --with-deps chromium
      - run: uv run python tools/docs_preview.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-review-${{ github.sha }}
          path: dist/docs-site
          retention-days: 14
